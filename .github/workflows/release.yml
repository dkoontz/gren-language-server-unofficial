name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/gren-language-server-unofficial

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../gren-language-server-unofficial-${{ matrix.target }}.tar.gz gren-language-server-unofficial

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/gren-language-server-unofficial.exe" -DestinationPath "gren-language-server-unofficial-${{ matrix.target }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: gren-language-server-unofficial-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            gren-language-server-unofficial-${{ matrix.target }}.tar.gz
            gren-language-server-unofficial-${{ matrix.target }}.zip

  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build VSIX
        working-directory: vscode
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: gren-language-server-unofficial-vsix
          path: vscode/*.vsix

  release:
    needs: [build, vsix]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/gren-language-server-unofficial-*
