name: Release

on:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version vscode/package.json)" >> "$GITHUB_OUTPUT"

      - name: Verify all pinned versions agree
        run: |
          version="${{ steps.version.outputs.version }}"
          fail() {
            echo "::error::$1 is '$2' but vscode/package.json is '$version'. Run 'just bump-version' locally and push."
            exit 1
          }
          zed_extension=$(sed -n 's/^version = "\(.*\)"$/\1/p' zed/extension.toml)
          [ "$zed_extension" = "$version" ] || fail zed/extension.toml "$zed_extension"
          zed_cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' zed/Cargo.toml)
          [ "$zed_cargo" = "$version" ] || fail zed/Cargo.toml "$zed_cargo"
          zed_lib=$(sed -n 's/^const VERSION: &str = "\(.*\)";$/\1/p' zed/src/lib.rs)
          [ "$zed_lib" = "$version" ] || fail zed/src/lib.rs "$zed_lib"
          zed_lock=$(awk '/^name = "gren-zed-extension-unofficial"$/ { getline; gsub(/^version = "|"$/, ""); print; exit }' zed/Cargo.lock)
          [ "$zed_lock" = "$version" ] || fail zed/Cargo.lock "$zed_lock"

      - name: Verify tag does not already exist
        run: |
          version="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists. Run 'just bump-version' to raise the version, then push before releasing."
            exit 1
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/gren-language-server-unofficial

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../gren-language-server-unofficial-${{ matrix.target }}.tar.gz gren-language-server-unofficial

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/gren-language-server-unofficial.exe" -DestinationPath "gren-language-server-unofficial-${{ matrix.target }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: gren-language-server-unofficial-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            gren-language-server-unofficial-${{ matrix.target }}.tar.gz
            gren-language-server-unofficial-${{ matrix.target }}.zip

  vsix:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build VSIX
        working-directory: vscode
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: gren-language-server-unofficial-vsix
          path: vscode/*.vsix

  release:
    needs: [version, build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/gren-language-server-unofficial-*
